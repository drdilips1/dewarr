# Optional new Audiobookshelf instance. Existing installations can be connected in Settings.
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - "127.0.0.1:13378:80"
    volumes:
      - ./data/audiobooks:/audiobooks
      - abs-config:/config
      - abs-metadata:/metadata
    restart: unless-stopped
volumes:
  abs-config:
  abs-metadata:
