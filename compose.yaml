name: dewarr

services:
  dewarr:
    image: ghcr.io/logabell/dewarr:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      PUBLIC_URL: http://localhost:8000
      DB_HOST: postgres
      DB_NAME: dewarr
      DB_USER: dewarr
      DB_PASSWORD: change-me
    volumes:
      - ./config:/config
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dewarr
      POSTGRES_USER: dewarr
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dewarr -d dewarr"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres:
